name: AetherLink Mobile release

on:
  push:
    tags:
      - 'aetherlink-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build release APKs
        run: |
          make android-apk-install-deps
          make android-apk-prepare
          make android-apk-release

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/*-arm64-v8a-release.apk out/AetherLink-Mobile-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/AetherLink-Mobile-universal.apk
          sha256sum out/*.apk > out/SHA256SUMS

      - name: Publish source-linked release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" \
            --title "AetherLink Mobile ${tag}" \
            --notes "Built from the public source at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${tag}. This modified Hiddify-derived work is provided under the Hiddify Extended GPL v3; see LICENSE.md and README.md. Personal non-commercial use only."
